covered_call_tickers:
  - MSFT
  - AAPL
  - NVDA
  - TQQQ

cash_secured_put_tickers:
  - TQQQ
  - TECL
  - NVDA
  - AMD
  - TSM

max_candidates_per_ticker_per_bucket: 5
options_data_provider: public
market_data_provider: yfinance
fundamentals_provider: yfinance
public_api_base_url: https://api.public.com
public_api_key_env_var: PUBLIC_API_KEY
public_access_token_validity_minutes: 15
public_http_timeout_seconds: 20
public_account_id: null
public_underlying_instrument_type: EQUITY
delta_put_min: -0.25
delta_put_max: -0.1
delta_call_min: 0.1
delta_call_max: 0.25

max_dte: 45
short_term_max_dte: 14
medium_term_max_dte: 28

min_open_interest: 100
min_volume: null
max_spread_pct: 0.15
# Options tab (Calls/Puts): default state of the "Clear suggested strike"
# toggle — only show strikes on the favorable side of the context panel's
# suggested strike (resistance for calls, support for puts). Per-profile,
# changeable from the tab itself (flipping it there saves the new default).
filter_by_suggested_strike: true
html_min_mid_price: 0.5
fill_price_factor: 0.4  # expected fill = bid + factor × (ask − bid); 0.5 = mid, sellers usually concede some spread
fetch_max_workers: 4    # tickers fetched concurrently (1 = sequential)
min_annualized_yield: 0.12

# Composite-score tuning. Weights are normalized by their sum, so they need
# not add to exactly 1. theta only differentiates when the Public greeks API
# supplies it (yfinance chains have no theta → neutral 0.5 for that component).
scoring:
  weights:
    income: 0.35     # risk-adjusted yield: annualized yield × (1 − |delta|)
    delta: 0.20      # proximity to delta_target
    trend: 0.15      # MA20/MA50/RSI alignment
    liquidity: 0.10  # spread + open interest + volume
    vrp: 0.10        # IV/HV20 premium richness (0.8x → 0, 1.6x → 1)
    theta: 0.10      # annualized theta decay per dollar of collateral
  delta_target: 0.20      # |delta| the delta component scores highest at
  income_yield_cap: 1.5   # absolute income axis saturates here (150% annualized)
risk_free_rate: 0.05

put_otm_pct_min: 0.05
put_otm_pct_max: 0.15
call_otm_pct_min: 0.05
call_otm_pct_max: 0.15

earnings_risk_penalty: 0.20

cc_recommendation:
  enabled: true
  max_recommendations: 50
  max_suggestions_per_term: 3
  earnings_buffer_days: 7
  delta_min: 0.10
  delta_max: 0.25
  use_resistance_filter: true
  resistance_pct_buffer: 0.02
  min_acceptable_sale_prices: {}
  min_strike_prices: {}   # optional per-ticker minimum strike filter, e.g. NVDA: 250
  max_strike_prices: {}   # optional per-ticker maximum strike filter, e.g. NVDA: 400
  min_yield: 0.10         # CALL screening yield threshold — when set, this REPLACES the global min_annualized_yield for calls
  long_term_months: 9     # monthly expirations to fetch beyond max_dte (0 = disabled)

csp_recommendation:
  enabled: true
  max_recommendations: 30
  ivr_min: 30.0
  earnings_buffer_days: 7
  delta_min: 0.10
  delta_max: 0.25
  use_support_filter: true
  support_pct_buffer: 0.02

output_dir: ./reports/shared
log_dir: ./logs/shared
cache_dir: ./cache/shared

# Shared across profiles — every scheduled run records one ATM IV snapshot per
# ticker; once iv_rank_min_history_days observations exist, the true IV Rank
# replaces the HV-rank proxy in recommendations.
iv_history_path: ./cache/iv_history.csv
iv_rank_min_history_days: 20

# Ledger of all CC/CSP recommendations; expired rows are graded against the
# close on expiration day (expired_otm / assigned / called_away + option P&L).
outcome_tracking:
  enabled: true
  path: ./cache/outcomes.csv
price_history_period: 1y
price_history_interval: 1d

schedule:
  enabled: true
  times:
    - "07:45"
    - "12:00"

# Shared sending account for report emails (every profile sends "from" this
# mailbox). SMTP_USER / SMTP_PASSWORD (an app password, not the account's
# regular login password) must be set as environment variables — see README.
# To actually receive emails, set `notify_email` in your own
# config/users/<profile>.yaml; a profile with no notify_email is skipped
# with a warning, not an error.
email:
  enabled: true
  smtp_host: smtp.gmail.com
  smtp_port: 587
  from_address: Prasanna.Kudli@gmail.com
  smtp_user_env_var: SMTP_USER
  smtp_password_env_var: SMTP_PASSWORD
